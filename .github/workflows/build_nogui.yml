name: Linux build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install --requirement scripts/requirements.txt
      - run: python -m unittest discover -s scripts/tests -p "test_*.py" -v
      - name: Validate shell scripts
        run: |
          find flatpak scripts -type f -name "*.sh" -print0 |
            xargs -0 -r -n1 bash -n

  native-build-and-tests:
    name: Native C++ build and tests
    runs-on: ubuntu-24.04
    # A cold run builds every dependency from source before BioSlicer itself; later runs
    # restore them from the cache below.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            build-essential \
            cmake \
            ffmpeg \
            git \
            libdbus-1-dev \
            libglu1-mesa-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            ninja-build \
            texinfo

      - name: Cache dependency downloads and compiled dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps/.pkg_cache
            deps/build-default
          key: ubuntu-24.04-deps-${{ hashFiles('deps/**', 'cmake/**', 'deps/CMakePresets.json') }}

      - name: Configure
        run: cmake --preset default -DSLIC3R_PCH=OFF

      - name: Build
        run: cmake --build build-default --parallel "$(nproc)"

      - name: Run C++ and Python integration tests
        env:
          BIOSLICER_BIN: ${{ github.workspace }}/build-default/src/prusa-slicer
        run: ctest --test-dir build-default --output-on-failure --timeout 300
